name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

# Two quick pushes to `release` must not run overlapping FTP mirrors, and an
# in-flight deploy must never be cancelled mid-transfer (that could leave the
# server half-updated) — so queue, never cancel.
concurrency:
  group: deploy-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # front/build.gradle.kts sets jvmToolchain(25).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # back/src/composer.json requires PHP ^8.1; buildWebsite depends on
      # :back:composerInstall.
      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: mbstring, curl, dom, xml
          coverage: none

      # Not preinstalled on the runner; the deployFtp task shells out to it.
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The four FTP parameters are repo secrets, passed as ORG_GRADLE_PROJECT_*
      # env vars (Gradle's standard way to feed project properties) rather than
      # -P command-line flags, so they never appear in argv/process listings —
      # deployFtp's providers.gradleProperty("ftp...") picks them up either way.
      # -PApiUrl=by-url makes the frontend derive its API base from
      # window.location at runtime, required for a same-origin prod deployment.
      - name: Build and deploy website over FTP
        env:
          ORG_GRADLE_PROJECT_ftpServer: ${{ secrets.FTP_SERVER }}
          ORG_GRADLE_PROJECT_ftpUsername: ${{ secrets.FTP_USERNAME }}
          ORG_GRADLE_PROJECT_ftpPassword: ${{ secrets.FTP_PASSWORD }}
          ORG_GRADLE_PROJECT_ftpDirectory: ${{ secrets.FTP_DIRECTORY }}
        run: ./gradlew deployFtp -PApiUrl=by-url --no-daemon --stacktrace
